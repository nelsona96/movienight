<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Night</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo__wrapper">
          <span class="logo__text">movienight</span>
        </div>
        <div class="nav__links">
          <a class="nav__link nav__link--secondary nav__link--highlight">Home</a>
          <a href="movies.html" class="nav__link nav__link--secondary link__effect--black nav__link--movies"
            >Movies</a
          >
          <a class="nav__link nav__link--primary">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <section id="landing">
        <div class="row">
          <div class="landing__action">
            <h1 class="landing__action--message">
              America's most awarded
              movie selection platform
            </h1>
            <h2 class="landing__action--command">
              Find the perfect movie with
              <span class="landing__logo--text text--highlight"
                >movienight</span
              >
            </h2>
            <div class="landing__search">
              <input
                type="text"
                placeholder="Search by Movie Name"
                class="search--input landing__search--input"
              />
              <button class="landing__search--button">
                <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 640"
                class="search-icon"
                style="fill: currentColor">
                  <path
                    d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="landing__img--wrapper">
            <img src="./assets/undraw__movienight.svg" alt="" class="landing__img">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
