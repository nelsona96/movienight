<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/3b48615774.js"
      crossorigin="anonymous"
    ></script>
    <script src="movies.js" defer></script>
  </head>
  <body>
    <header id="header__search">
      <nav>
        <a class="logo__wrapper" onclick="goHome()">
          <span class="logo__text text--white">movienight</span>
        </a>
        <div class="nav__links">
          <a
            class="nav__link nav__link--secondary nav__link--white link__effect--white text--white"
            onclick="goHome()"
            >Home</a
          >
          <a
            class="nav__link nav__link--secondary nav__link--white nav__link--highlight text--white"
            >Movies</a
          >
          <a class="nav__link nav__link--primary">Contact</a>
        </div>
      </nav>
      <div class="header__search--wrapper">
        <h1 class="header__search--title text--white">
          Find the Perfect Movie
        </h1>
        <div class="header__search">
          <input
            id="search-bar"
            type="text"
            placeholder="Search by Movie Name"
            class="search--input header__search--input"
          />
          <div class="search-icon--wrapper">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              class="header__search--icon"
              style="fill: currentColor"
            >
              <path
                d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"
              />
            </svg>
          </div>
        </div>
      </div>
      <div class="overlay"></div>
    </header>

    <main>
      <section id="results">
        <div class="container results__container">
          <div class="row results__row">
            <div class="results__header">
              <div class="results__info--container">
                <h3 class="results__info">Search for Your Movie.</h3>
              </div>
              <div class="results__filter">
                <select id="filter">
                  <option value="" selected disabled>Sort By</option>
                  <option value="DATE_NEWEST">Date, Newest</option>
                  <option value="DATE_OLDEST">Date, Oldest</option>
                  <option value="A_TO_Z">Alphabetical, A to Z</option>
                  <option value="Z_TO_A">Alphabetical, Z to A</option>
                </select>
              </div>
            </div>
            <div class="results">
              <div class="no-search__img--wrapper">
                <img
                  src="./assets/undraw_search-guy-sitting.svg"
                  class="no-search__img"
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
